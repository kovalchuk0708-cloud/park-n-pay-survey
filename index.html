<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Training prototype of a parking space rental app for Dubai. Sample listings, no real payments.">
<title>Park’N’Pay Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: left rail + wide content on large monitors, tab bar on phones.
   Palette: deep navy ground, amber (parking-sign) accent, blue-tinted neutrals. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#E9EDF4; --ink:#0E1B2E; --muted:#56667E; --line:#D9E0EB;
  --primary:#102B4C; --on-primary:#FFFFFF; --accent:#F2A413; --on-accent:#2B1D00; --accent-bg:#FDF0D3;
  --side:#0F2744; --side-ink:#D5E0F0; --side-muted:#8FA3C0; --side-line:#233E63;
  --good:#17804F; --good-bg:#E2F4EA; --bad:#B83232; --bad-bg:#FBE6E6;
  --sea:#CFE0F3; --land:#EAE6DA; --road:#FFFFFF; --pin:#102B4C; --pin-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(14,27,46,.06),0 10px 28px rgba(14,27,46,.07);
  --fd:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif; --fb:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1322; --surface:#111D31; --surface-2:#182740; --ink:#EAF0FA; --muted:#98A8C0; --line:#233450;
    --primary:#F2A413; --on-primary:#2B1D00; --accent:#F2A413; --on-accent:#2B1D00; --accent-bg:#3A2C0C;
    --side:#0C1729; --side-ink:#D5E0F0; --side-muted:#8397B5; --side-line:#1D3250;
    --good:#4CC38A; --good-bg:#12301F; --bad:#F07A7A; --bad-bg:#3A1A1A;
    --sea:#12263F; --land:#17233A; --road:#22344F; --pin:#F2A413; --pin-ink:#2B1D00;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1322; --surface:#111D31; --surface-2:#182740; --ink:#EAF0FA; --muted:#98A8C0; --line:#233450;
  --primary:#F2A413; --on-primary:#2B1D00; --accent:#F2A413; --on-accent:#2B1D00; --accent-bg:#3A2C0C;
  --side:#0C1729; --side-ink:#D5E0F0; --side-muted:#8397B5; --side-line:#1D3250;
  --good:#4CC38A; --good-bg:#12301F; --bad:#F07A7A; --bad-bg:#3A1A1A;
  --sea:#12263F; --land:#17233A; --road:#22344F; --pin:#F2A413; --pin-ink:#2B1D00;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
@media (min-width:1500px){body{font-size:16px}}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.ic{flex:none;vertical-align:-3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:1.15rem}
.bname{font-family:var(--fd);font-weight:700;font-size:1.05rem;display:flex;flex-direction:column;line-height:1.1}
.bname small{font-family:var(--fb);font-weight:600;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-top:3px}
.side .brand{padding:4px 10px 22px}
.navitem{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:var(--side-ink);text-align:left;font-weight:600}
.navitem:hover{background:var(--side-line)}
.navitem[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.navitem .count{margin-left:auto;font-size:.78rem;background:var(--side-line);color:var(--side-ink);padding:1px 8px;border-radius:99px}
.navitem[aria-current="page"] .count{background:rgba(43,29,0,.15);color:var(--on-accent)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--side-line);font-size:.84rem;color:var(--side-muted)}
.side-foot strong{display:block;color:var(--side-ink);font-size:.92rem}

.content{min-width:0;padding:0 clamp(16px,3vw,44px) 56px}
.demo-strip{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:9px 12px;margin:0 calc(-1*clamp(16px,3vw,44px));background:var(--accent-bg);color:var(--ink);font-size:.84rem;text-align:center}
.demo-strip b{background:var(--accent);color:var(--on-accent);padding:1px 8px;border-radius:99px;font-size:.72rem;letter-spacing:.08em}
.mbrand{display:none;padding:14px 0 0}
.mbrand .brand{color:var(--ink)}
.main{max-width:1560px;margin:0 auto;padding-top:26px}
.page-head{margin-bottom:18px;display:flex;flex-direction:column;gap:6px}
.page-head h1{font-size:clamp(1.5rem,2.2vw,2.1rem)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(1.12);border-color:var(--primary)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-lg{padding:14px 20px;font-size:1.02rem;width:100%}
.input,.select,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.input{min-height:96px;resize:vertical}
.input:focus,.select:focus{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-weight:600;font-size:.86rem}
.hint{font-size:.82rem;color:var(--muted)}
.err{color:var(--bad);font-size:.86rem}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:99px;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:20px}

.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:12px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:0 12px;min-height:44px}
.search input{flex:1;border:0;background:transparent;min-width:0;outline:none;min-height:42px}
.toolbar .select{width:auto;min-width:170px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
.filters .select{width:auto;min-width:150px;padding:7px 12px;min-height:38px;border-radius:99px}
.divider{width:1px;height:24px;background:var(--line)}

/* explore */
.explore{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.mapcol{display:none}
.explore.show-map .mapcol{display:block}
.explore.show-map #results{display:none}
@media (min-width:1100px){
  .explore{grid-template-columns:minmax(0,1fr) minmax(360px,40%)}
  .mapcol{display:block;position:sticky;top:16px}
  .explore.show-map #results{display:block}
  .maptoggle{display:none}
}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.res-head .select{width:auto;min-width:170px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.lart{position:relative;aspect-ratio:16/10;background:var(--surface-2)}
.lart svg{display:block;width:100%;height:100%}
.favbtn{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#0E1B2E;display:grid;place-items:center}
.favbtn.on{color:#C0392B}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink)}
.lart .tag{position:absolute;left:10px;bottom:10px;background:rgba(15,39,68,.88);color:#fff}
.lbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.lbody h3{font-size:1.02rem}
.rate{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.88rem}
.rate .ic{color:var(--accent)}
.lprice{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;gap:6px}
.lprice strong{font-family:var(--fd);font-size:1.15rem}
.empty{padding:44px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-size:1.15rem}

/* map */
.mapbox{overflow:hidden;padding:0}
.mapbox svg{display:block;width:100%;height:auto}
.mapnote{padding:10px 14px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line)}
.pin{cursor:pointer}
.pin rect{fill:var(--pin)}
.pin text{fill:var(--pin-ink);font-family:var(--fb);font-weight:700}
.pin:hover rect{fill:var(--accent)} .pin:hover text{fill:var(--on-accent)}
.alabel{fill:var(--muted);font-family:var(--fb);font-weight:600;letter-spacing:.04em}

/* detail */
.back{margin-bottom:14px}
.detail{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
@media (min-width:1000px){.detail{grid-template-columns:minmax(0,1fr) 400px}}
.hero-art{border-radius:18px;overflow:hidden;aspect-ratio:16/8;background:var(--surface-2)}
.hero-art svg{display:block;width:100%;height:100%}
.dhead{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.dhead h1{font-size:clamp(1.4rem,2.2vw,2rem)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.feat{display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:.9rem;background:var(--surface)}
.section{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.section h2{font-size:1.15rem}
.host{display:flex;gap:14px;align-items:center;padding:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-family:var(--fd)}
.review{padding:14px;display:flex;flex-direction:column;gap:6px}
.book{position:sticky;top:16px;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow:auto}
@media (max-width:999px){.book{position:static;max-height:none}}
.book .price-big{font-family:var(--fd);font-size:1.6rem;font-weight:700}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:4px}
.stepper button{width:38px;height:38px;border:0;border-radius:8px;background:var(--surface-2);font-size:1.2rem;font-weight:700}
.stepper span{font-weight:700}
.quote{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:12px;font-size:.92rem}
.quote div{display:flex;justify-content:space-between;gap:10px}
.quote .total{font-weight:800;font-size:1.05rem;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.cal{display:flex;flex-direction:column;gap:8px}
.cal-head{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.cal-head button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .dow{font-size:.72rem;color:var(--muted);font-weight:700;padding:2px 0}
.cal-grid button{border:0;background:var(--surface-2);border-radius:8px;min-height:36px;font-weight:600}
.cal-grid button.in{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-grid button.start{background:var(--accent);color:var(--on-accent)}
.cal-grid button[disabled]{background:transparent;color:var(--muted);opacity:.45;text-decoration:line-through;cursor:not-allowed}
.cal-grid .pad-cell{min-height:36px}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.notice{padding:10px 12px;border-radius:10px;background:var(--accent-bg);font-size:.86rem}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.good{background:var(--good-bg);color:var(--good)}

/* lists */
.stack{display:flex;flex-direction:column;gap:14px}
.bk{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;padding:14px;align-items:center}
.bk .thumb{width:96px;aspect-ratio:4/3;border-radius:10px;overflow:hidden}
.bk .thumb svg{width:100%;height:100%;display:block}
.status{font-size:.76rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--good-bg);color:var(--good)}
.status.off{background:var(--bad-bg);color:var(--bad)}
@media (max-width:640px){.bk{grid-template-columns:72px minmax(0,1fr)}.bk .thumb{width:72px}.bk .acts{grid-column:1/-1}}
.msgs{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:18px;min-height:520px}
@media (max-width:760px){.msgs{grid-template-columns:minmax(0,1fr)}}
.tlist button{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px}
.tlist button[aria-current="true"]{background:var(--accent-bg)}
.thread{display:flex;flex-direction:column;min-height:520px}
.thread-head{padding:14px 16px;border-bottom:1px solid var(--line)}
.bubbles{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.bubble{max-width:78%;padding:10px 14px;border-radius:14px;background:var(--surface-2)}
.bubble.me{align-self:flex-end;background:var(--primary);color:var(--on-primary)}
.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.formgrid .wide{grid-column:1/-1}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:1100px){.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;font-size:.94rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.rating{display:flex;gap:8px}
.rating button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800}
.rating button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* tabbar */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);padding:6px 2px;position:relative}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--accent)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .tabbar{display:flex}
  .mbrand{display:block}
  .content{padding-bottom:96px}
  .main{padding-top:18px}
}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.auth-hero{background:var(--side);color:var(--side-ink);padding:clamp(24px,5vw,72px);display:flex;flex-direction:column;gap:22px;justify-content:center}
.auth-hero h1{font-size:clamp(1.8rem,3.4vw,3rem);color:#fff;max-width:18ch}
.auth-hero p{max-width:52ch;color:var(--side-ink)}
.auth-points{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.auth-points li{display:flex;gap:10px;align-items:flex-start}
.auth-points .ic{color:var(--accent);margin-top:2px}
.auth-wrap{display:grid;place-items:center;padding:clamp(16px,4vw,48px)}
.auth-card{width:100%;max-width:440px;padding:26px;display:flex;flex-direction:column;gap:16px}
.auth-card h2{font-size:1.35rem}
@media (max-width:860px){.auth{grid-template-columns:minmax(0,1fr)}.auth-hero{padding:28px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayIdx=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const fmtDate=s=>parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const money=n=>'AED '+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const aed=n=>'AED '+Number(n).toLocaleString('en-US');
const hash=s=>{let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const initials=n=>String(n).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'U';

const IC={
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  pin:'<path d="M12 21s-6-5.5-6-11a6 6 0 1 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',
  bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
  shield:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',

/* ---------- pricing & availability ---------- */
function booked(l,d){return (dayIdx(d)+hash(l.id))%17<2}
function rangeDates(l,b){
  const s=parse(b.start);
  if(b.period==='day'){const r=[];for(let i=0;i<b.qty;i++)r.push(addDays(s,i));return r}
  return [s];
}
function availability(l,b){
  const t=today();
  const bad=rangeDates(l,b).filter(d=>d<t||booked(l,d));
  return {ok:bad.length===0,bad};
}
function quote(l,b){
  const unit=l[b.period], sub=unit*b.qty;
  const fee=Math.round(sub*0.05*100)/100;
  const vat=Math.round((sub+fee)*0.05*100)/100;
  return {unit,sub,fee,vat,total:Math.round((sub+fee+vat)*100)/100};
}
function newDraft(l){
  const p=S.filters.period;
  let start=addDays(today(),1);
  for(let i=0;i<40&&booked(l,start);i++) start=addDays(start,1);
  S.draft={period:p,qty:PERIODS[p].def,start:iso(start),time:'09:00',plate:'',err:''};
  S.cal={y:start.getFullYear(),m:start.getMonth()};
}
function endTime(time,qty){
  const h=parseInt(time.slice(0,2),10)+qty;
  return h>=24?'24:00':pad(h)+':'+time.slice(3);
}

/* ---------- filtering ---------- */
function filtered(){
  const f=S.filters, q=f.q.trim().toLowerCase();
  let r=allListings().filter(l=>{
    if(f.area!=='All areas'&&l.area!==f.area) return false;
    if(f.types.length&&f.types.indexOf(l.type)<0) return false;
    if(f.size!=='Any'&&SIZE_RANK[l.size]<SIZE_RANK[f.size]) return false;
    if(f.ev&&l.features.indexOf('EV charging')<0) return false;
    if(f.maxPrice&&l[f.period]>f.maxPrice) return false;
    if(q&&(l.title+' '+l.area+' '+l.type+' '+l.features.join(' ')+' '+l.desc).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  if(f.sort==='price') r.sort((a,b)=>a[f.period]-b[f.period]);
  else if(f.sort==='rating') r.sort((a,b)=>(+b.rating||0)-(+a.rating||0));
  return r;
}

const AUTO=[
  [/price|cost|discount|cheap/i,'The listed price is fixed, but I can offer a small discount on monthly plans.'],
  [/ev|charg/i,'If the bay has a charger it is listed under what is included. Please bring your own cable.'],
  [/gate|access|tag|remote|enter/i,'Access details are sent after you reserve. The gate opens with a code at the barrier.'],
  [/visit|view|see|show/i,'Happy to meet for a quick look, just tell me a day that works for you.'],
  [/available|date|when|free/i,'The calendar on the listing is up to date. Pick any day that is not struck through.']
];
function autoReply(text){
  for(let i=0;i<AUTO.length;i++) if(AUTO[i][0].test(text)) return AUTO[i][1];
  return 'Thanks for your message. The bay is yours for the whole booking. Let me know if you need anything else.';
}

    save();
  }
  S.thread=l.id;
}
function act(a,v){
  switch(a){
    case 'nav': go(v); break;
    case 'open': {
      const l=byId(v); if(!l) return;
      if(S.view!=='detail') S.prev=(S.view==='confirm'?'bookings':S.view);
      S.selected=v; S.view='detail'; newDraft(l); S.flash=''; render(); window.scrollTo(0,0); break;
    }
    case 'back': go(S.prev||'explore'); break;
    case 'fav': {
      const i=S.fav.indexOf(v); if(i>=0) S.fav.splice(i,1); else S.fav.push(v);
      save(); if(S.view==='explore') {refreshExplore(); const s=document.querySelector('.side'); if(s) s.outerHTML=renderSide();} else render(); break;
    }
    case 'type': {
      const t=S.filters.types, i=t.indexOf(v); if(i>=0) t.splice(i,1); else t.push(v); refreshExplore(); break;
    }
    case 'ev': S.filters.ev=!S.filters.ev; refreshExplore(); break;
    case 'period': S.filters.period=v; S.filters.maxPrice=0; refreshExplore(); break;
    case 'clear': S.filters={q:'',area:'All areas',types:[],size:'Any',maxPrice:0,ev:false,period:S.filters.period,sort:'rec'}; render(); break;
    case 'map': S.showMap=!S.showMap; render(); break;
    case 'bperiod': {S.draft.period=v; S.draft.qty=PERIODS[v].def; S.draft.err=''; refreshBook(); break}
    case 'qty': {
      const P=PERIODS[S.draft.period], n=S.draft.qty+Number(v);
      S.draft.qty=Math.max(1,Math.min(P.max,n)); S.draft.err=''; refreshBook(); break;
    }
    case 'day': S.draft.start=v; S.draft.err=''; refreshBook(); break;
    case 'calprev': {let m=S.cal.m-1,y=S.cal.y; if(m<0){m=11;y--} S.cal={y:y,m:m}; refreshBook(); break}
    case 'calnext': {let m=S.cal.m+1,y=S.cal.y; if(m>11){m=0;y++} S.cal={y:y,m:m}; refreshBook(); break}
    case 'reserve': {
      const l=byId(S.selected); if(!l) return;
      const b=S.draft, plate=(b.plate||'').trim();
      if(plate.length<2){b.err='Enter your vehicle plate so the host can recognise your car.'; refreshBook(); return}
      if(!availability(l,b).ok){b.err='Those dates are not available.'; refreshBook(); return}
      const q=quote(l,b);
      const rec={id:'PNP-'+(1000+Math.floor(Math.random()*9000)),listingId:l.id,title:l.title,area:l.area,period:b.period,qty:b.qty,start:b.start,time:b.time,plate:plate,total:q.total,status:'Upcoming',created:Date.now()};
      S.bookings.push(rec); S.lastBooking=rec.id; S.rated=0; S.ratedSent=false; save(); S.view='confirm'; render(); window.scrollTo(0,0); break;
    }
    case 'cancel': S.cancelAsk=v; render(); break;
    case 'cancelno': S.cancelAsk=null; render(); break;
    case 'cancelyes': {const b=S.bookings.find(x=>x.id===v); if(b) b.status='Cancelled'; S.cancelAsk=null; save(); render(); break}
    case 'rate': S.rated=Number(v); render(); break;
    case 'sendsurvey': {
      const n=document.getElementById('srvnote');
      S.surveys.push({rating:S.rated,note:n?n.value.slice(0,400):'',at:Date.now()}); S.ratedSent=true; save(); render(); break;
    }
    case 'contact': {const l=byId(v); if(!l) return; ensureThread(l); go('messages'); break}
    case 'thread': S.thread=v; render(); break;
    case 'dellist': {
      S.mine=S.mine.filter(x=>x.id!==v); S.fav=S.fav.filter(x=>x!==v); save(); render(); break;
    }
    case 'authtab': S.authTab=v; S.authErr=''; render(); break;
    case 'guest': S.user={name:'Guest',email:''}; save(); render(); break;
    case 'logout': S.user=null; S.view='explore'; render(); break;
    case 'reset': {
      S.fav=[];S.bookings=[];S.mine=[];S.threads={};S.surveys=[];S.thread=null;save(); S.profileMsg='Demo data cleared.'; render(); break;
    }
  }
}

document.addEventListener('click',function(e){
  const el=e.target.closest('[data-a]'); if(!el) return;
  const s=el.dataset.a, i=s.indexOf(':');
  act(i<0?s:s.slice(0,i), i<0?'':s.slice(i+1));
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  const el=e.target.closest&&e.target.closest('[data-a]');
  if(el&&el===e.target&&el.tagName!=='BUTTON'){e.preventDefault();el.click()}
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='q'){S.filters.q=t.value; const r=document.getElementById('results'); if(r) r.innerHTML=renderResults(); const m=document.getElementById('mapcol'); if(m) m.innerHTML=renderMap();}
  else if(t.id==='plate'&&S.draft){S.draft.plate=t.value.toUpperCase(); S.draft.err=''}
});
document.addEventListener('change',function(e){
  const t=e.target, f=t.dataset&&t.dataset.f; if(!f) return;
  if(f==='area'){S.filters.area=t.value; refreshExplore()}
  else if(f==='size'){S.filters.size=t.value; refreshExplore()}
  else if(f==='maxPrice'){S.filters.maxPrice=Number(t.value); refreshExplore()}
  else if(f==='sort'){S.filters.sort=t.value; refreshExplore()}
  else if(f==='time'&&S.draft){S.draft.time=t.value; refreshBook()}
});
document.addEventListener('submit',function(e){
  const form=e.target, kind=form.dataset&&form.dataset.form; if(!kind) return;
  e.preventDefault();
  const fd=new FormData(form);
  if(kind==='auth'){
    const email=String(fd.get('email')||'').trim(), pass=String(fd.get('pass')||''), name=String(fd.get('name')||'').trim();
    if(email.indexOf('@')<1||email.indexOf('.')<0){S.authErr='Enter a valid email address.';render();return}
    if(pass.length<6){S.authErr='Use at least 6 characters for the password.';render();return}
    if(S.authTab==='up'&&name.length<2){S.authErr='Enter your full name.';render();return}
    S.authErr=''; S.user={name:name||email.split('@')[0],email:email}; save(); render();
  }else if(kind==='msg'){
    const inp=document.getElementById('msgInput'), text=inp?inp.value.trim():''; if(!text||!S.thread) return;
    const id=S.thread; S.threads[id].msgs.push({from:'me',text:text}); save(); render();
    setTimeout(function(){
      if(S.threads[id]){S.threads[id].msgs.push({from:'host',text:autoReply(text)}); save(); if(S.view==='messages'&&S.thread===id) render()}
    },1300);
  }else if(kind==='list'){
    const g=k=>String(fd.get(k)||'').trim(), title=g('title'), bay=g('bay');
    const hour=Number(g('hour')), day=Number(g('day')), month=Number(g('month'));
    if(title.length<4){S.formErr='Give the listing a title of at least 4 characters.';render();return}
    if(!(hour>0&&day>0&&month>0)){S.formErr='Enter all three prices as numbers above zero.';render();return}
    const l={id:'u'+Date.now(),title:title,area:g('area'),type:g('type'),size:g('size'),hour:hour,day:day,month:month,rating:0,reviews:0,features:fd.getAll('feat'),owner:S.user.name,verified:false,since:new Date().getFullYear(),bay:bay||'—',desc:g('desc')||'No description added yet.'};
    l.rating=''; S.mine.push(l); S.formErr=''; S.flash='Listing published. Find it in Explore under '+l.area+'.'; save(); render(); window.scrollTo(0,0);
  }else if(kind==='profile'){
    const name=String(fd.get('name')||'').trim(), email=String(fd.get('email')||'').trim();
    if(name.length<2){S.profileMsg='';render();return}
    S.user={name:name,email:email}; S.profileMsg='Profile saved.'; save(); render();
  }
});

load();
render();
})();
</script>

</body>
</html>
